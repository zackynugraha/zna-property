<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZNA Property — Rental Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{
  --ink:#18212b;--muted:#73808c;--line:#e8e9e6;--paper:#f6f4ef;--card:#fff;--deep:#111922;
  --gold:#b58a4a;--gold2:#d6bb8b;--green:#3f806e;--greenSoft:#edf5f1;--red:#b65c56;--redSoft:#fbefed;
  --amber:#a67a25;--amberSoft:#fbf5e5;--blue:#4d6e9a;--blueSoft:#eef3f9;--shadow:0 16px 45px rgba(25,35,43,.07);
  --r:18px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:"DM Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;background:#121920}.auth-hero{position:relative;overflow:hidden;padding:64px;background:linear-gradient(135deg,#121920,#1b2730 55%,#273631);color:white}.auth-hero:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 25% 20%,rgba(214,187,139,.18),transparent 25%),radial-gradient(circle at 80% 75%,rgba(63,128,110,.16),transparent 28%)}.auth-content{position:relative;z-index:1;max-width:620px}.mark{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}.mark-icon{width:44px;height:44px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.07);color:var(--gold2)}.serif{font-family:"Playfair Display",serif}.hero-title{font-size:58px;line-height:1.02;margin:70px 0 18px;letter-spacing:-.04em}.hero-copy{max-width:510px;color:#cad2d6;line-height:1.85}.hero-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:44px}.hero-stat .box{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;background:rgba(255,255,255,.045)}.hero-stat strong{display:block;font-size:20px}.hero-stat span{font-size:11px;color:#aab7bf}.auth-panel{display:grid;place-items:center;background:#f5f2eb;padding:34px}.auth-box{width:min(410px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.auth-box h2{font-family:"Playfair Display",serif;font-size:34px;margin:28px 0 8px}.auth-box p{color:var(--muted);line-height:1.7}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#606b75}.field input,.field select,.field textarea{border:1px solid #d9ddd9;border-radius:12px;padding:12px 13px;outline:none;background:white;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(181,138,74,.12)}
/* Layout */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--deep);color:white;padding:22px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:7px 10px}.brand-icon{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#2a3842,#1b2630);border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;color:var(--gold2)}.brand strong{font-size:15px;letter-spacing:.03em}.brand span{font-size:10px;color:#8c9aa4;display:block;margin-top:2px}.nav{margin-top:28px;display:flex;flex-direction:column;gap:4px}.nav-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#65727b;padding:11px 11px 7px}.nav-btn{border:0;background:transparent;color:#aeb8bf;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:600;width:100%;transition:.18s}.nav-btn i{width:18px;text-align:center;font-size:13px}.nav-btn:hover{background:#1a252d;color:white}.nav-btn.active{background:#202d35;color:white;box-shadow:inset 3px 0 0 var(--gold)}.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:13px}.profile{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:35px;height:35px;border-radius:10px;background:#283640;color:#f0dec0;display:grid;place-items:center;font-weight:700}.profile small{color:#83909a}.profile strong{font-size:12px;display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{padding:29px 34px 50px;max-width:1700px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:26px}.crumb{color:#8b949d;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.page-title{font-family:"Playfair Display",serif;font-size:36px;letter-spacing:-.03em;margin:6px 0}.page-sub{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d9ddd9;background:white;color:#36414b;border-radius:11px;padding:10px 13px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn:hover{background:#fbfaf7}.btn.primary{background:var(--deep);color:white;border-color:var(--deep)}.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}.btn.ghost{background:transparent}.btn.danger{background:var(--redSoft);border-color:#f0d0cc;color:var(--red)}
.grid-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:19px 20px;box-shadow:0 7px 30px rgba(25,35,43,.04);position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-55px;top:-55px;background:rgba(181,138,74,.07)}.kpi-head{display:flex;justify-content:space-between;align-items:center}.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8a949b;font-weight:700}.kpi-icon{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;background:#f2efe7;color:var(--gold)}.kpi-value{font-size:28px;font-weight:700;margin-top:14px;letter-spacing:-.03em}.kpi-foot{font-size:11px;color:#8d969d;margin-top:5px}
.section{margin-top:20px;background:white;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 7px 30px rgba(25,35,43,.04);overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.section-title{font-weight:700}.section-sub{font-size:11px;color:#8b949d;margin-top:3px}.section-body{padding:18px 20px}.two-col{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}
/* bookings */
.booking-banner{display:grid;grid-template-columns:1.5fr .5fr;gap:0;background:linear-gradient(125deg,#16232b,#263b42);border-radius:20px;overflow:hidden;color:white;position:relative}.booking-banner-main{padding:25px}.booking-banner h3{font-family:"Playfair Display",serif;font-size:27px;margin:3px 0 7px}.booking-banner p{color:#c9d2d5;max-width:530px;line-height:1.7;font-size:12px}.banner-meta{display:flex;gap:22px;margin-top:18px}.banner-meta strong{display:block;font-size:15px}.banner-meta span{display:block;color:#9cafb6;font-size:10px;margin-top:3px}.booking-banner-side{display:flex;align-items:center;justify-content:center;border-left:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(214,187,139,.34);box-shadow:inset 0 0 0 11px rgba(255,255,255,.03)}.ring strong{font-size:24px}.ring span{display:block;font-size:9px;color:#9cafb6;text-align:center}
.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.filters input,.filters select{height:38px;border:1px solid #d9ddd9;border-radius:10px;background:white;padding:0 11px;color:var(--ink);outline:none}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#929aa0;text-align:left;padding:12px 15px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:14px 15px;border-bottom:1px solid #f0f1ef;font-size:12px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fcfbf8}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:700}.pill.green{background:var(--greenSoft);color:var(--green)}.pill.red{background:var(--redSoft);color:var(--red)}.pill.amber{background:var(--amberSoft);color:var(--amber)}.pill.blue{background:var(--blueSoft);color:var(--blue)}.muted{color:#91999f}.amount{font-weight:700}.row-actions{display:flex;gap:5px}.icon-btn{width:30px;height:30px;border:1px solid #e0e3df;border-radius:9px;background:white;display:grid;place-items:center;color:#6a7379}.icon-btn:hover{background:#f7f6f2}
/* calendar */
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.calendar-nav{display:flex;gap:7px}.month-name{font-family:"Playfair Display",serif;font-size:23px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-right:0;border-bottom:0;border-radius:13px;overflow:hidden}.dow{background:#f8f7f2;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8b949d;padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.day{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:white}.day.other{background:#fbfbf9;color:#b6bdc2}.day-num{font-size:11px;font-weight:700;color:#7f8991}.day.today .day-num{display:inline-grid;width:22px;height:22px;place-items:center;border-radius:50%;background:var(--deep);color:white}.stay-chip{margin-top:6px;border-radius:8px;padding:6px 7px;background:#f3efe6;border:1px solid #eadfca;font-size:9px;line-height:1.3;overflow:hidden}.stay-chip strong{display:block;font-size:10px}.stay-chip small{color:#7b6850}.stay-chip.checked{background:#edf5f1;border-color:#cfe3da}.stay-chip.out{background:#eef3f9;border-color:#d7e2f0}.stay-chip.cancelled{opacity:.5;text-decoration:line-through}
/* dashboard blocks */
.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eff0ee}.list-item:last-child{border-bottom:0}.list-main{min-width:0}.list-main strong{display:block;font-size:12px}.list-main span{display:block;color:#90989e;font-size:10px;margin-top:3px}.price{font-weight:700;font-size:12px;text-align:right}.empty{padding:35px 10px;text-align:center;color:#969ea4}.empty i{font-size:25px;color:#c1c6c9;margin-bottom:9px}.empty strong{display:block;color:#68727a}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,21,.55);display:grid;place-items:center;padding:18px;z-index:50;backdrop-filter:blur(4px)}.modal-card{width:min(720px,100%);max-height:calc(100vh - 36px);overflow:auto;background:white;border-radius:20px;border:1px solid #e6e7e3;box-shadow:0 25px 80px rgba(0,0,0,.18)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 21px;border-bottom:1px solid var(--line)}.modal-head h3{font-family:"Playfair Display",serif;font-size:24px;margin:0}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.alert{padding:10px 12px;border-radius:10px;font-size:11px;background:#f8f7f2;border:1px solid var(--line);color:#66717a}.alert.error{background:var(--redSoft);border-color:#f0d0cc;color:var(--red)}
.toast{position:fixed;right:20px;bottom:20px;background:#162129;color:white;border-radius:12px;padding:12px 15px;box-shadow:0 18px 40px rgba(0,0,0,.18);font-size:12px;z-index:80}.toast i{color:var(--gold2);margin-right:7px}
.mobile-top{display:none}
@media(max-width:1100px){.grid-kpi{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.booking-banner{grid-template-columns:1fr}.booking-banner-side{display:none}.hero-title{font-size:46px}}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-top{display:flex;position:sticky;top:0;z-index:20;background:var(--deep);color:white;padding:12px 14px;align-items:center;justify-content:space-between}.main{padding:22px 15px}.page-title{font-size:29px}.grid-kpi{grid-template-columns:1fr 1fr}.auth{grid-template-columns:1fr}.auth-hero{display:none}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:560px){.grid-kpi{grid-template-columns:1fr}.topbar{flex-direction:column}.calendar{font-size:9px}.day{min-height:90px}.stay-chip{font-size:8px}.hero-stat{grid-template-columns:1fr}.auth-panel{padding:18px}.auth-box{padding:25px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const state={user:null,csrf:null,page:'dashboard',apartments:[],units:[],tenants:[],guests:[],leases:[],payments:[],expenses:[],stays:[],dashboard:null,month:new Date().toISOString().slice(0,7)};
const app=document.getElementById('app');
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const dateID=d=>new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(d+'T00:00:00'));
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
function toast(msg,ok=true){document.getElementById('toastRoot').innerHTML='<div class="toast"><i class="fas '+(ok?'fa-check':'fa-circle-exclamation')+'"></i>'+escapeHtml(msg)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',2800)}
async function api(url,opt={}){const o={...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}};if(state.csrf)o.headers['x-csrf-token']=state.csrf;const r=await fetch(url,o);const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Terjadi kesalahan');return data}
async function boot(){try{const m=await api('/api/auth/me');state.user=m.user;state.csrf=m.csrfToken;await loadAll();render()}catch{renderLogin()}}
async function loadAll(){const [a,u,t,g,l,p,e,s,d]=await Promise.all([api('/api/apartments'),api('/api/units'),api('/api/tenants'),api('/api/guests'),api('/api/leases'),api('/api/payments'),api('/api/expenses'),api('/api/stays?month='+state.month),api('/api/dashboard')]);Object.assign(state,{apartments:a,units:u,tenants:t,guests:g,leases:l,payments:p,expenses:e,stays:s,dashboard:d})}
function renderLogin(){app.innerHTML=`<div class="auth"><section class="auth-hero"><div class="auth-content"><div class="mark"><div class="mark-icon"><i class="fas fa-building"></i></div><div>ZNA PROPERTY</div></div><div class="hero-title serif">Manage every stay.<br><em>Beautifully.</em></div><p class="hero-copy">Satu workspace untuk mengelola apartemen, sewa harian, kontrak bulanan, pembayaran, dan profit — dengan tampilan yang dibuat untuk operator property modern.</p><div class="hero-stat"><div class="box"><strong>Daily Stay</strong><span>Booking, check-in, check-out</span></div><div class="box"><strong>Monthly Lease</strong><span>Kontrak & recurring rent</span></div><div class="box"><strong>Finance</strong><span>Revenue & expense control</span></div></div></div></section><section class="auth-panel"><div class="auth-box"><div class="brand"><div class="brand-icon"><i class="fas fa-building"></i></div><div><strong>ZNA Property</strong><span style="display:block;color:#8d9499;font-size:10px">Rental Management</span></div></div><h2>Welcome back</h2><p>Masuk untuk mengelola portfolio property Anda.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn gold" style="width:100%;justify-content:center;margin-top:5px"><i class="fas fa-arrow-right-to-bracket"></i> Masuk ke dashboard</button><div id="loginErr" class="alert error hidden" style="margin-top:12px"></div></form></div></section></div>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const err=document.getElementById('loginErr');err.classList.add('hidden');try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});state.user=x.user;state.csrf=x.csrfToken;await loadAll();render()}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}}}
function shell(content){app.innerHTML=`<div class="mobile-top"><div class="brand"><div class="brand-icon"><i class="fas fa-building"></i></div><strong>ZNA</strong></div><button class="icon-btn" style="background:#1e2a33;color:white;border-color:#31414d" onclick="document.querySelector('.sidebar').style.display=document.querySelector('.sidebar').style.display==='flex'?'none':'flex'"><i class="fas fa-bars"></i></button></div><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-icon"><i class="fas fa-building"></i></div><div><strong>ZNA PROPERTY</strong><span>Rental Management</span></div></div><nav class="nav"><div class="nav-title">Overview</div>${nav('dashboard','fa-gauge-high','Dashboard')}${nav('bookings','fa-calendar-check','Booking Harian')}${nav('calendar','fa-calendar-days','Kalender')}${nav('units','fa-door-open','Unit')}${nav('guests','fa-user-group','Tamu')}${nav('leases','fa-file-contract','Kontrak Bulanan')}<div class="nav-title">Finance</div>${nav('payments','fa-wallet','Pembayaran')}${nav('expenses','fa-receipt','Pengeluaran')}${nav('reports','fa-chart-line','Laporan')}</nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">${escapeHtml((state.user?.name||'A').slice(0,1).toUpperCase())}</div><div style="min-width:0"><strong>${escapeHtml(state.user?.name||'Administrator')}</strong><small>${escapeHtml(state.user?.email||'')}</small></div><button class="icon-btn" title="Logout" onclick="logout()" style="margin-left:auto;background:#18232b;color:#c7d0d5;border-color:#2c3942"><i class="fas fa-right-from-bracket"></i></button></div></div></aside><main class="main">${content}</main></div>`}
function nav(key,icon,label){return `<button class="nav-btn ${state.page===key?'active':''}" onclick="go('${key}')"><i class="fas ${icon}"></i><span>${label}</span></button>`}
function go(p){state.page=p;render()}
function render(){if(!state.user)return renderLogin();if(state.page==='dashboard')renderDashboard();else if(state.page==='bookings')renderBookings();else if(state.page==='calendar')renderCalendar();else if(state.page==='units')renderUnits();else if(state.page==='guests')renderGuests();else if(state.page==='leases')renderLeases();else if(state.page==='payments')renderPayments();else if(state.page==='expenses')renderExpenses();else renderReports()}
function header(crumb,title,sub,actions=''){return `<div class="topbar"><div><div class="crumb">${crumb}</div><div class="page-title">${title}</div><div class="page-sub">${sub}</div></div><div class="top-actions">${actions}</div></div>`}
function renderDashboard(){const d=state.dashboard||{};const today=new Date().toISOString().slice(0,10);const ci=state.stays.filter(s=>s.check_in===today&&s.status!=='cancelled');const co=state.stays.filter(s=>s.check_out===today&&s.status!=='cancelled');const upcoming=state.stays.filter(s=>s.check_in>=today&&s.status!=='cancelled').slice(0,6);const occ=d.occupancy||0;shell(header('Overview','Good morning, Zacky','Control your property portfolio from one place.',`<button class="btn" onclick="openStayModal()"><i class="fas fa-plus"></i> New booking</button><button class="btn primary" onclick="openExpenseModal()"><i class="fas fa-arrow-down"></i> Record expense</button>`)+`<section class="booking-banner"><div class="booking-banner-main"><div class="crumb" style="color:#c6ab7d">ZNA STAY DESK</div><h3>Daily rental, handled with elegance.</h3><p>Jadwal masuk-keluar, tarif malam, deposit, channel booking, dan pembayaran harian dalam satu panel operasional.</p><div class="banner-meta"><div><strong>${ci.length}</strong><span>Check-in today</span></div><div><strong>${co.length}</strong><span>Check-out today</span></div><div><strong>${state.stays.filter(s=>s.status==='reserved').length}</strong><span>Upcoming</span></div></div></div><div class="booking-banner-side"><div class="ring"><div style="text-align:center"><strong>${occ.toFixed(0)}%</strong><span>portfolio occupancy</span></div></div></div></section><div class="grid-kpi" style="margin-top:20px"><div class="kpi"><div class="kpi-head"><span class="kpi-label">Revenue</span><span class="kpi-icon"><i class="fas fa-arrow-trend-up"></i></span></div><div class="kpi-value">${rupiah(d.income)}</div><div class="kpi-foot">Recorded payments</div></div><div class="kpi"><div class="kpi-head"><span class="kpi-label">Net profit</span><span class="kpi-icon"><i class="fas fa-chart-line"></i></span></div><div class="kpi-value">${rupiah(d.profit)}</div><div class="kpi-foot">Revenue less expenses</div></div><div class="kpi"><div class="kpi-head"><span class="kpi-label">Units occupied</span><span class="kpi-icon"><i class="fas fa-bed"></i></span></div><div class="kpi-value">${d.occupied||0} / ${d.units||0}</div><div class="kpi-foot">${occ.toFixed(0)}% occupancy</div></div><div class="kpi"><div class="kpi-head"><span class="kpi-label">Receivables</span><span class="kpi-icon"><i class="fas fa-clock"></i></span></div><div class="kpi-value">${rupiah(d.arrears)}</div><div class="kpi-foot">Current monthly arrears</div></div></div><div class="two-col"><section class="section"><div class="section-head"><div><div class="section-title">Upcoming stays</div><div class="section-sub">Reservation yang paling dekat dengan hari ini.</div></div><button class="btn" onclick="go('bookings')">View all <i class="fas fa-arrow-right"></i></button></div><div class="section-body">${upcoming.length?upcoming.map(stayRow).join(''):`<div class="empty"><i class="fas fa-calendar-xmark"></i><strong>Belum ada booking mendatang</strong><span>Tambahkan booking pertama Anda.</span></div>`}</div></section><section class="section"><div class="section-head"><div><div class="section-title">Today at a glance</div><div class="section-sub">Aktivitas operasional hari ini.</div></div></div><div class="section-body"><div class="list-item"><div class="list-main"><strong>Check-in</strong><span>Tamu tiba hari ini</span></div><div class="price">${ci.length}</div></div><div class="list-item"><div class="list-main"><strong>Check-out</strong><span>Tamu keluar hari ini</span></div><div class="price">${co.length}</div></div><div class="list-item"><div class="list-main"><strong>Units</strong><span>Total unit terdaftar</span></div><div class="price">${d.units||0}</div></div><div class="list-item"><div class="list-main"><strong>Expenses</strong><span>Recorded this period</span></div><div class="price">${rupiah(d.expense)}</div></div></div></section></div>`)}
function stayRow(s){return `<div class="list-item"><div class="list-main"><strong>${escapeHtml(s.guest_name)} <span style="font-weight:500;color:#999">· ${escapeHtml(s.unit_code)}</span></strong><span>${dateID(s.check_in)} — ${dateID(s.check_out)} · ${s.nights} malam · ${escapeHtml(s.channel)}</span></div><div style="text-align:right"><div class="price">${rupiah(s.total_amount)}</div><div style="margin-top:5px">${statusPill(s.status)}</div></div></div>`}
function statusPill(s){const map={reserved:['amber','Reserved'],checked_in:['green','Checked-in'],checked_out:['blue','Checked-out'],cancelled:['red','Cancelled'],paid:['green','Paid'],partial:['amber','Partial'],unpaid:['red','Unpaid']};const x=map[s]||['blue',s];return `<span class="pill ${x[0]}"><i class="fas ${s==='checked_in'?'fa-key':s==='paid'?'fa-check':'fa-circle-dot'}"></i>${x[1]}</span>`}
function renderBookings(){shell(header('Operations','Daily Booking','Kelola sewa harian dari reservation sampai checkout.',`<button class="btn" onclick="openGuestModal()"><i class="fas fa-user-plus"></i> New guest</button><button class="btn gold" onclick="openStayModal()"><i class="fas fa-calendar-plus"></i> New booking</button>`)+`<section class="section"><div class="section-head"><div><div class="section-title">Stay ledger</div><div class="section-sub">Booking aktif, check-in, check-out, dan status pembayaran.</div></div><div class="filters"><input id="bookingSearch" placeholder="Search guest / unit / booking" oninput="filterBookings()"><select id="bookingStatus" onchange="filterBookings()"><option value="">All status</option><option value="reserved">Reserved</option><option value="checked_in">Checked-in</option><option value="checked_out">Checked-out</option><option value="cancelled">Cancelled</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Booking</th><th>Guest</th><th>Unit</th><th>Stay</th><th>Rate</th><th>Total</th><th>Status</th><th>Payment</th><th></th></tr></thead><tbody id="bookingRows">${bookingRows(state.stays)}</tbody></table></div></section>`)}
function bookingRows(arr){return arr.map(s=>`<tr data-search="${escapeHtml((s.booking_code+' '+s.guest_name+' '+s.unit_code+' '+s.apartment_name).toLowerCase())}" data-status="${s.status}"><td><strong>${escapeHtml(s.booking_code)}</strong><div class="muted" style="margin-top:3px">${escapeHtml(s.channel)}</div></td><td><strong>${escapeHtml(s.guest_name)}</strong><div class="muted" style="margin-top:3px">${escapeHtml(s.guest_phone||'')}</div></td><td><strong>${escapeHtml(s.unit_code)}</strong><div class="muted" style="margin-top:3px">${escapeHtml(s.apartment_name)}</div></td><td><strong>${dateID(s.check_in)}</strong><div class="muted">to ${dateID(s.check_out)} · ${s.nights} nights</div></td><td>${rupiah(s.nightly_rate)}<div class="muted">/ night</div></td><td class="amount">${rupiah(s.total_amount)}</td><td>${statusPill(s.status)}</td><td>${statusPill(s.payment_status)}</td><td><div class="row-actions"><button class="icon-btn" title="Edit" onclick="openStayModal(${s.id})"><i class="fas fa-pen"></i></button><button class="icon-btn" title="Delete" onclick="deleteStay(${s.id})"><i class="fas fa-trash"></i></button></div></td></tr>`).join('')||`<tr><td colspan="9"><div class="empty"><i class="fas fa-calendar-xmark"></i><strong>Belum ada booking</strong></div></td></tr>`}
function filterBookings(){const q=(document.getElementById('bookingSearch')?.value||'').toLowerCase();const st=document.getElementById('bookingStatus')?.value||'';document.querySelectorAll('#bookingRows tr').forEach(r=>{const okQ=!q||r.dataset.search.includes(q);const okS=!st||r.dataset.status===st;r.style.display=okQ&&okS?'':'none'})}
function renderCalendar(){const [y,m]=state.month.split('-').map(Number);const first=new Date(y,m-1,1);const start=(first.getDay()+6)%7;const days=new Date(y,m,0).getDate();let html='';for(let i=0;i<start;i++)html+='<div class="day other"></div>';for(let d=1;d<=days;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const today=new Date().toISOString().slice(0,10);const stays=state.stays.filter(s=>s.status!=='cancelled'&&s.check_in<=ds&&s.check_out>ds);html+=`<div class="day ${ds===today?'today':''}"><div class="day-num">${d}</div>${stays.slice(0,3).map(s=>`<div class="stay-chip ${s.status==='checked_in'?'checked':s.status==='checked_out'?'out':''}" onclick="openStayModal(${s.id})"><strong>${escapeHtml(s.unit_code)} · ${escapeHtml(s.guest_name).slice(0,16)}</strong><small>${s.check_in===ds?'IN ':''}${s.check_out===ds?'OUT':''}</small></div>`).join('')}${stays.length>3?`<div class="muted" style="font-size:9px;margin-top:4px">+${stays.length-3} more</div>`:''}</div>`}shell(header('Operations','Booking Calendar','Visual occupancy untuk memastikan setiap unit terjadwal rapi.',`<button class="btn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button><button class="btn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button><button class="btn gold" onclick="openStayModal()"><i class="fas fa-plus"></i> Booking</button>`)+`<section class="section"><div class="section-head"><div class="month-name">${new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(new Date(y,m-1,1))}</div><div class="muted">Click a reservation to open details</div></div><div class="section-body"><div class="calendar"><div class="dow">Mon</div><div class="dow">Tue</div><div class="dow">Wed</div><div class="dow">Thu</div><div class="dow">Fri</div><div class="dow">Sat</div><div class="dow">Sun</div>${html}</div></div></section>`)}
async function changeMonth(delta){const [y,m]=state.month.split('-').map(Number);let d=new Date(y,m-1+delta,1);state.month=d.toISOString().slice(0,7);state.stays=await api('/api/stays?month='+state.month);renderCalendar()}
function renderUnits(){shell(header('Portfolio','Units','Kelola unit, tipe, status, dan target pendapatan.',`<button class="btn gold" onclick="openUnitModal()"><i class="fas fa-plus"></i> Add unit</button>`)+`<section class="section"><div class="section-head"><div><div class="section-title">Unit inventory</div><div class="section-sub">Unit harian dan bulanan dikelola dari inventory yang sama.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Unit</th><th>Property</th><th>Type</th><th>Status</th><th>Monthly target</th><th>Current</th><th></th></tr></thead><tbody>${state.units.map(u=>`<tr><td><strong>${escapeHtml(u.unit_code)}</strong><div class="muted">Floor ${escapeHtml(u.floor||'-')}</div></td><td>${escapeHtml(u.apartment_name)}</td><td>${escapeHtml(u.type||'-')}</td><td>${u.status==='occupied'?statusPill('checked_in'):u.status==='reserved'?statusPill('reserved'):`<span class="pill blue">${escapeHtml(u.status)}</span>`}</td><td>${rupiah(u.monthly_target)}</td><td>${u.tenant_name?escapeHtml(u.tenant_name):'Available'}</td><td><button class="icon-btn" onclick="openUnitModal(${u.id})"><i class="fas fa-pen"></i></button></td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><i class="fas fa-door-open"></i><strong>No units yet</strong></div></td></tr>`}</tbody></table></div></section>`)}
function renderGuests(){shell(header('Operations','Guests','Data tamu untuk daily stay dan history kunjungan.',`<button class="btn gold" onclick="openGuestModal()"><i class="fas fa-user-plus"></i> Add guest</button>`)+`<section class="section"><div class="section-head"><div class="section-title">Guest directory</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Guest</th><th>Contact</th><th>ID number</th><th>Stays</th><th>Notes</th><th></th></tr></thead><tbody>${state.guests.map(g=>`<tr><td><strong>${escapeHtml(g.name)}</strong></td><td>${escapeHtml(g.phone||'-')}<div class="muted">${escapeHtml(g.email||'')}</div></td><td>${escapeHtml(g.id_number||'-')}</td><td>${g.stay_count||0}</td><td>${escapeHtml(g.notes||'-')}</td><td><button class="icon-btn" onclick="openGuestModal(${g.id})"><i class="fas fa-pen"></i></button></td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><i class="fas fa-user-group"></i><strong>No guests yet</strong></div></td></tr>`}</tbody></table></div></section>`)}
function renderLeases(){shell(header('Portfolio','Monthly Leases','Kontrak sewa bulanan untuk unit yang tidak dijalankan harian.',`<button class="btn" onclick="openGuestModal()"><i class="fas fa-user-plus"></i> Guest</button>`)+`<section class="section"><div class="section-head"><div class="section-title">Active & historical leases</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Unit</th><th>Tenant</th><th>Period</th><th>Rent</th><th>Deposit</th><th>Status</th></tr></thead><tbody>${state.leases.map(l=>`<tr><td><strong>${escapeHtml(l.unit_code)}</strong><div class="muted">${escapeHtml(l.apartment_name)}</div></td><td>${escapeHtml(l.tenant_name)}</td><td>${dateID(l.start_date)} — ${l.end_date?dateID(l.end_date):'Open-ended'}</td><td>${rupiah(l.monthly_rent)} / month</td><td>${rupiah(l.deposit)}</td><td>${statusPill(l.status==='active'?'checked_in':l.status==='upcoming'?'reserved':'checked_out')}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><i class="fas fa-file-contract"></i><strong>No leases</strong></div></td></tr>`}</tbody></table></div></section>`)}
function renderPayments(){shell(header('Finance','Payments','Semua penerimaan yang masuk dari daily stay maupun monthly lease.',`<button class="btn gold" onclick="openPaymentModal()"><i class="fas fa-plus"></i> Record payment</button>`)+`<section class="section"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Unit</th><th>Tenant / Guest</th><th>Period</th><th>Method</th><th>Amount</th><th>Reference</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>${dateID(p.payment_date)}</td><td><strong>${escapeHtml(p.unit_code)}</strong><div class="muted">${escapeHtml(p.apartment_name)}</div></td><td>${escapeHtml(p.tenant_name||'-')}</td><td>${p.period_month?dateID(String(p.period_month).slice(0,10)):'Daily stay'}</td><td>${escapeHtml(p.payment_method)}</td><td class="amount">${rupiah(p.amount)}</td><td>${escapeHtml(p.reference||'-')}</td></tr>`).join('')||`<tr><td colspan="7"><div class="empty"><i class="fas fa-wallet"></i><strong>No payments</strong></div></td></tr>`}</tbody></table></div></section>`)}
function renderExpenses(){shell(header('Finance','Expenses','Kontrol biaya cleaning, service charge, utilities, dan maintenance.',`<button class="btn primary" onclick="openExpenseModal()"><i class="fas fa-plus"></i> Add expense</button>`)+`<section class="section"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Property</th><th>Unit</th><th>Vendor</th><th>Amount</th></tr></thead><tbody>${state.expenses.map(e=>`<tr><td>${dateID(e.expense_date)}</td><td><strong>${escapeHtml(e.category)}</strong></td><td>${escapeHtml(e.apartment_name||'-')}</td><td>${escapeHtml(e.unit_code||'-')}</td><td>${escapeHtml(e.vendor||'-')}</td><td class="amount">${rupiah(e.amount)}</td></tr>`).join('')||`<tr><td colspan="6"><div class="empty"><i class="fas fa-receipt"></i><strong>No expenses</strong></div></td></tr>`}</tbody></table></div></section>`)}
function renderReports(){const d=state.dashboard||{};shell(header('Finance','Reports','Snapshot finansial portfolio property.',`<a class="btn" href="/api/export/payments"><i class="fas fa-file-csv"></i> Export payments</a><a class="btn" href="/api/export/expenses"><i class="fas fa-file-csv"></i> Export expenses</a>`)+`<div class="grid-kpi"><div class="kpi"><span class="kpi-label">Revenue</span><div class="kpi-value">${rupiah(d.income)}</div></div><div class="kpi"><span class="kpi-label">Expenses</span><div class="kpi-value">${rupiah(d.expense)}</div></div><div class="kpi"><span class="kpi-label">Net profit</span><div class="kpi-value">${rupiah(d.profit)}</div></div><div class="kpi"><span class="kpi-label">Occupancy</span><div class="kpi-value">${(d.occupancy||0).toFixed(1)}%</div></div></div><section class="section"><div class="section-head"><div><div class="section-title">Property performance</div><div class="section-sub">Target rent dan occupancy per property.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Property</th><th>Units</th><th>Occupied</th><th>Occupancy</th><th>Target rent</th></tr></thead><tbody>${(d.byApartment||[]).map(x=>`<tr><td><strong>${escapeHtml(x.name)}</strong></td><td>${x.units}</td><td>${x.occupied}</td><td>${x.units?((Number(x.occupied)/Number(x.units))*100).toFixed(0):0}%</td><td>${rupiah(x.target)}</td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">No data</div></td></tr>`}</tbody></table></div></section>`)}
function modal(title,body,submitLabel='Save',submitId='modalSubmit'){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-card"><div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()"><i class="fas fa-xmark"></i></button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" id="${submitId}">${submitLabel}</button></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openStayModal(id){const s=id?state.stays.find(x=>x.id===id):null;modal('Daily stay',`<div class="form-grid"><div class="field"><label>Booking code</label><input id="fCode" value="${escapeHtml(s?.booking_code||'')}" placeholder="Auto if empty"></div><div class="field"><label>Channel</label><select id="fChannel">${['direct','whatsapp','instagram','traveloka','tiket.com','airbnb','booking.com','agoda','other'].map(x=>`<option ${s?.channel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select id="fUnit">${state.units.map(x=>`<option value="${x.id}" ${Number(s?.unit_id)===Number(x.id)?'selected':''}>${escapeHtml(x.unit_code)} · ${escapeHtml(x.apartment_name)}</option>`).join('')}</select></div><div class="field"><label>Guest</label><select id="fGuest">${state.guests.map(x=>`<option value="${x.id}" ${Number(s?.guest_id)===Number(x.id)?'selected':''}>${escapeHtml(x.name)} · ${escapeHtml(x.phone||'')}</option>`).join('')}</select></div><div class="field"><label>Check-in</label><input id="fIn" type="date" value="${s?.check_in||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Check-out</label><input id="fOut" type="date" value="${s?.check_out||new Date(Date.now()+86400000).toISOString().slice(0,10)}"></div><div class="field"><label>Nightly rate</label><input id="fRate" type="number" min="0" value="${s?.nightly_rate||0}"></div><div class="field"><label>Cleaning fee</label><input id="fClean" type="number" min="0" value="${s?.cleaning_fee||0}"></div><div class="field"><label>Deposit</label><input id="fDeposit" type="number" min="0" value="${s?.deposit||0}"></div><div class="field"><label>Payment status</label><select id="fPay"><option value="unpaid" ${s?.payment_status==='unpaid'?'selected':''}>Unpaid</option><option value="partial" ${s?.payment_status==='partial'?'selected':''}>Partial</option><option value="paid" ${s?.payment_status==='paid'?'selected':''}>Paid</option><option value="refunded" ${s?.payment_status==='refunded'?'selected':''}>Refunded</option></select></div><div class="field"><label>Stay status</label><select id="fStatus"><option value="reserved" ${s?.status==='reserved'?'selected':''}>Reserved</option><option value="checked_in" ${s?.status==='checked_in'?'selected':''}>Checked-in</option><option value="checked_out" ${s?.status==='checked_out'?'selected':''}>Checked-out</option><option value="cancelled" ${s?.status==='cancelled'?'selected':''}>Cancelled</option></select></div><div class="field full"><label>Notes</label><textarea id="fNotes" placeholder="Special request, guest note, etc.">${escapeHtml(s?.notes||'')}</textarea></div><div class="alert full"><i class="fas fa-circle-info"></i> Total otomatis = nightly rate × nights + cleaning fee. Deposit tidak dihitung sebagai revenue.</div></div>`,'Save','modalSubmit');document.getElementById('modalSubmit').onclick=async()=>{try{const b={booking_code:document.getElementById('fCode').value,channel:document.getElementById('fChannel').value,unit_id:document.getElementById('fUnit').value,guest_id:document.getElementById('fGuest').value,check_in:document.getElementById('fIn').value,check_out:document.getElementById('fOut').value,nightly_rate:document.getElementById('fRate').value,cleaning_fee:document.getElementById('fClean').value,deposit:document.getElementById('fDeposit').value,payment_status:document.getElementById('fPay').value,status:document.getElementById('fStatus').value,notes:document.getElementById('fNotes').value};await api(id?`/api/stays/${id}`:'/api/stays',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast(id?'Booking updated':'Booking created')}catch(e){toast(e.message,false)}}}
async function deleteStay(id){if(!confirm('Delete booking ini?'))return;try{await api('/api/stays/'+id,{method:'DELETE'});await loadAll();render();toast('Booking deleted')}catch(e){toast(e.message,false)}}
function openGuestModal(id){const g=id?state.guests.find(x=>x.id===id):null;modal('Guest profile',`<div class="form-grid"><div class="field full"><label>Full name</label><input id="gName" value="${escapeHtml(g?.name||'')}"></div><div class="field"><label>Phone</label><input id="gPhone" value="${escapeHtml(g?.phone||'')}"></div><div class="field"><label>Email</label><input id="gEmail" value="${escapeHtml(g?.email||'')}"></div><div class="field"><label>ID number</label><input id="gId" value="${escapeHtml(g?.id_number||'')}"></div><div class="field full"><label>Notes</label><textarea id="gNotes">${escapeHtml(g?.notes||'')}</textarea></div></div>`);document.getElementById('modalSubmit').onclick=async()=>{try{const b={name:gName.value,phone:gPhone.value,email:gEmail.value,id_number:gId.value,notes:gNotes.value};await api(id?`/api/guests/${id}`:'/api/guests',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast(id?'Guest updated':'Guest added')}catch(e){toast(e.message,false)}}}
function openExpenseModal(){modal('New expense',`<div class="form-grid"><div class="field"><label>Date</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Category</label><select id="eCat">${['Cleaning','Laundry','Utilities','Internet','Service charge','Maintenance','Supplies','Marketing','Tax','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Property</label><select id="eApt"><option value="">Select</option>${state.apartments.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select></div><div class="field"><label>Unit</label><select id="eUnit"><option value="">Select</option>${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.unit_code)}</option>`).join('')}</select></div><div class="field"><label>Amount</label><input id="eAmount" type="number" min="0"></div><div class="field"><label>Vendor</label><input id="eVendor"></div><div class="field full"><label>Description</label><textarea id="eDesc"></textarea></div></div>`);document.getElementById('modalSubmit').onclick=async()=>{try{await api('/api/expenses',{method:'POST',body:JSON.stringify({expense_date:eDate.value,category:eCat.value,apartment_id:eApt.value||null,unit_id:eUnit.value||null,amount:eAmount.value,vendor:eVendor.value,description:eDesc.value})});closeModal();await loadAll();render();toast('Expense recorded')}catch(e){toast(e.message,false)}}}
function openPaymentModal(){modal('Record payment',`<div class="form-grid"><div class="field"><label>Date</label><input id="pDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Unit</label><select id="pUnit">${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.unit_code)} · ${escapeHtml(u.apartment_name)}</option>`).join('')}</select></div><div class="field"><label>Guest / Tenant</label><select id="pTenant"><option value="">Select</option>${state.tenants.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}</select></div><div class="field"><label>Period month</label><input id="pPeriod" type="month"></div><div class="field"><label>Amount</label><input id="pAmount" type="number" min="0"></div><div class="field"><label>Method</label><select id="pMethod"><option>bank_transfer</option><option>cash</option><option>card</option><option>qris</option><option>ewallet</option></select></div><div class="field"><label>Reference</label><input id="pRef"></div><div class="field full"><label>Description</label><textarea id="pDesc"></textarea></div></div>`);document.getElementById('modalSubmit').onclick=async()=>{try{await api('/api/payments',{method:'POST',body:JSON.stringify({payment_date:pDate.value,unit_id:pUnit.value,tenant_id:pTenant.value||null,period_month:pPeriod.value||null,amount:pAmount.value,payment_method:pMethod.value,reference:pRef.value,description:pDesc.value})});closeModal();await loadAll();render();toast('Payment recorded')}catch(e){toast(e.message,false)}}}
function openUnitModal(id){const u=id?state.units.find(x=>x.id===id):null;modal('Unit profile',`<div class="form-grid"><div class="field"><label>Property</label><select id="uApt">${state.apartments.map(a=>`<option value="${a.id}" ${Number(u?.apartment_id)===Number(a.id)?'selected':''}>${escapeHtml(a.name)}</option>`).join('')}</select></div><div class="field"><label>Unit code</label><input id="uCode" value="${escapeHtml(u?.unit_code||'')}"></div><div class="field"><label>Floor</label><input id="uFloor" value="${escapeHtml(u?.floor||'')}"></div><div class="field"><label>Type</label><input id="uType" value="${escapeHtml(u?.type||'Studio')}" placeholder="Studio / 1BR / 2BR"></div><div class="field"><label>Status</label><select id="uStatus"><option value="available">Available</option><option value="reserved">Reserved</option><option value="occupied">Occupied</option><option value="maintenance">Maintenance</option></select></div><div class="field"><label>Monthly target</label><input id="uTarget" type="number" min="0" value="${u?.monthly_target||0}"></div><div class="field full"><label>Notes</label><textarea id="uNotes">${escapeHtml(u?.notes||'')}</textarea></div></div>`);if(u)uStatus.value=u.status;document.getElementById('modalSubmit').onclick=async()=>{try{const b={apartment_id:uApt.value,unit_code:uCode.value,floor:uFloor.value,type:uType.value,status:uStatus.value,monthly_target:uTarget.value,notes:uNotes.value};await api(id?`/api/units/${id}`:'/api/units',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast(id?'Unit updated':'Unit added')}catch(e){toast(e.message,false)}}}
function logout(){api('/api/auth/logout',{method:'POST'}).finally(()=>{state.user=null;state.csrf=null;renderLogin()})}
boot();
</script>
</body>
</html>
