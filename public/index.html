<style>

*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.hidden{display:none!important}
.app{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);color:#d9e0e4;padding:18px 14px;display:flex;flex-direction:column;z-index:50}.brand{display:flex;align-items:center;gap:11px;padding:6px 9px 18px;border-bottom:1px solid rgba(255,255,255,.08)}.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#2d3d46,#18242b);display:grid;place-items:center;color:#e1bd82}.brand strong{font:800 15px Manrope}.brand span{display:block;font-size:10px;color:#87939b;margin-top:2px}.nav{padding-top:18px;overflow:auto}.nav-title{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#65727b;padding:12px 10px 7px}.nav-btn{width:100%;border:0;background:transparent;color:#9eabb3;padding:10px 11px;border-radius:10px;display:flex;gap:11px;align-items:center;text-align:left;font-weight:600;margin:2px 0}.nav-btn:hover{background:#18252c;color:#fff}.nav-btn.active{background:#1d2b33;color:#fff;box-shadow:inset 3px 0 var(--gold)}.nav-btn i{width:18px;text-align:center}.sidebar-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}.profile{display:flex;align-items:center;gap:9px;padding:7px}.avatar{width:34px;height:34px;border-radius:10px;background:#2a3942;color:#f0d2a4;display:grid;place-items:center;font-weight:800}.profile-text{min-width:0}.profile-text strong,.profile-text small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-text strong{font-size:12px}.profile-text small{font-size:10px;color:#7e8a92}.main{min-width:0;padding:28px 34px 60px;max-width:1700px;width:100%;margin:auto}.mobile-head{display:none}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:800}.title{font:800 34px Manrope;margin:6px 0 4px;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 13px;border-radius:11px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 7px rgba(0,0,0,.02)}.btn:hover{border-color:#c4a16c}.btn.primary{background:var(--nav);border-color:var(--nav);color:white}.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}.btn.danger{background:#fff0ef;color:var(--danger);border-color:#f0cfcb}.btn.small{padding:7px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}.theme{display:flex;gap:3px;margin:5px 3px 12px;padding:3px;background:#111b21;border:1px solid #26333b;border-radius:9px}.theme button{flex:1;border:0;background:transparent;color:#8c9aa2;padding:6px;border-radius:7px;font-size:10px}.theme button.active{background:#2b3941;color:#fff}.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpi{padding:17px}.kpi-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:700}.kpi-icon{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;color:var(--gold)}.kpi-value{font:800 23px Manrope;margin-top:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi-foot{font-size:10px;color:var(--muted);margin-top:5px}.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;margin-top:16px}.section{padding:18px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.section-title{font:800 15px Manrope}.section-sub{font-size:11px;color:var(--muted);margin-top:3px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}.table th{background:var(--surface2);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.b-green{background:#eaf7f0;color:#247455}.b-yellow{background:#fff5dc;color:#956b18}.b-red{background:#fff0ef;color:#a03f3b}.b-blue{background:#edf5fb;color:#356c9a}.b-gray{background:var(--surface2);color:var(--muted)}[data-theme=dark] .b-green,[data-theme=dark] .b-yellow,[data-theme=dark] .b-red,[data-theme=dark] .b-blue{filter:brightness(.75)}.property-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.property-card{padding:18px;position:relative;overflow:hidden}.property-card:after{content:"";position:absolute;right:-30px;top:-35px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(180,138,82,.15)}.property-head{display:flex;justify-content:space-between;gap:10px}.property-name{font:800 17px Manrope}.property-location{font-size:11px;color:var(--muted);margin-top:4px}.property-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:17px 0}.metric{padding:10px;background:var(--surface2);border-radius:10px}.metric strong{display:block;font-size:14px}.metric span{font-size:9px;color:var(--muted)}.share-list{display:grid;gap:7px;margin-top:10px}.share-row{display:flex;justify-content:space-between;font-size:11px;padding-bottom:7px;border-bottom:1px dashed var(--line)}.share-row:last-child{border:0}.progress{height:7px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}.notice{padding:12px;border-radius:11px;background:var(--surface2);color:var(--muted);font-size:11px;border:1px solid var(--line)}.empty{padding:40px 15px;text-align:center;color:var(--muted);display:grid;gap:7px;place-items:center}.empty i{font-size:25px;color:var(--gold)}.modal-backdrop{position:fixed;inset:0;background:rgba(5,10,13,.62);display:grid;place-items:center;padding:18px;z-index:100}.modal{width:min(760px,100%);max-height:min(90vh,800px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head strong{font:800 17px Manrope}.modal-body{padding:20px}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:10px;padding:10px 11px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(180,138,82,.12)}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:var(--nav)}.login-left{padding:8vw;display:flex;flex-direction:column;justify-content:center;color:#fff;background:radial-gradient(circle at 70% 30%,#273943,#0d171d 55%,#091015)}.login-left h1{font:800 clamp(38px,5vw,70px) Manrope;line-height:1.02;letter-spacing:-.05em;margin:25px 0 15px}.login-left em{color:#d5b277;font-style:normal}.login-left p{max-width:560px;color:#aebac0;line-height:1.7}.login-points{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:25px}.login-points div{padding:12px;border:1px solid #2a3a43;border-radius:12px;background:#121e25}.login-points strong,.login-points span{display:block}.login-points strong{font-size:11px}.login-points span{font-size:9px;color:#829099;margin-top:4px}.login-right{display:grid;place-items:center;background:var(--surface)}.login-box{width:min(430px,88%)}.login-brand{display:flex;align-items:center;gap:10px}.login-brand .brand-icon{color:var(--gold);background:var(--surface2)}.login-box h2{font:800 30px Manrope;margin:30px 0 7px}.login-box p{color:var(--muted);font-size:13px;margin:0 0 22px}.alert{padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--muted)}.alert.error{background:#fff0ef;border-color:#f0cfcb;color:var(--danger)}.drawer-overlay{display:none}
@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}.property-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{display:block}.sidebar{position:fixed;left:0;top:0;width:280px;transform:translateX(-105%);transition:.22s;height:100dvh;box-shadow:20px 0 60px rgba(0,0,0,.25)}body.nav-open .sidebar{transform:translateX(0)}.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:40}.drawer-overlay.active{display:block}.mobile-head{display:flex;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:11px 14px;align-items:center;justify-content:space-between}.main{padding:20px 16px 45px}.topbar{flex-direction:column}.actions{justify-content:flex-start}.grid2{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-left{display:none}}
@media(max-width:650px){.kpis{grid-template-columns:repeat(2,1fr);gap:9px}.kpi{padding:13px}.kpi-value{font-size:18px}.property-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.title{font-size:27px}.section{padding:13px}.btn{padding:9px 11px}.actions{width:100%}.actions .btn{flex:1;justify-content:center}.property-metrics{grid-template-columns:repeat(3,1fr)}.modal-backdrop{padding:8px}.modal{max-height:94dvh}.login-points{grid-template-columns:1fr}.mobile-head .btn{padding:8px 10px}}
@media(max-width:430px){.kpis{grid-template-columns:1fr}.property-metrics{grid-template-columns:1fr 1fr 1fr}.subtitle{font-size:12px}}
</style>

<body data-theme="light">
<div id="app"></div>
<script>
const app=document.getElementById('app');
const state={user:null,csrf:null,page:'dashboard',apartments:[],units:[],guests:[],stays:[],expenses:[],dashboard:{},financials:[],masterLeases:[],partners:[],users:[]};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rupiah=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const dateNow=()=>new Date().toISOString().slice(0,10);
function api(url,opt={}){const o={...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}};if(state.csrf)o.headers['x-csrf-token']=state.csrf;return fetch(url,o).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request gagal');return d})}
function admin(){return state.user?.role==='admin'}
function theme(){return localStorage.getItem('zna-theme')||'light'}
function setTheme(t){localStorage.setItem('zna-theme',t);document.body.dataset.theme=t;render()}
async function logout(){
  const btns=document.querySelectorAll('[onclick*="logout"]');
  btns.forEach(b=>{b.disabled=true;b.style.pointerEvents='none';});
  try{
    await api('/api/auth/logout',{method:'POST'});
  }catch(e){
    console.warn('Logout request failed:',e.message);
  }
  state.user=null;
  state.csrf=null;
  try{sessionStorage.clear();}catch(e){}
  window.location.replace('/');
}
function openNav(){document.body.classList.add('nav-open');document.querySelector('.sidebar')?.classList.add('is-open');$('drawerOverlay')?.classList.add('active');document.body.style.overflow='hidden'}
function closeNav(){document.body.classList.remove('nav-open');document.querySelector('.sidebar')?.classList.remove('is-open');$('drawerOverlay')?.classList.remove('active');document.body.style.overflow=''}
function toast(msg,ok=true){const x=document.createElement('div');x.style='position:fixed;right:18px;bottom:18px;z-index:200;padding:12px 15px;border-radius:11px;background:'+(ok?'#183a2f':'#4b2421')+';color:#fff;box-shadow:0 15px 40px #0004;font-size:12px;font-weight:700';x.innerHTML='<i class="fas '+(ok?'fa-circle-check':'fa-circle-exclamation')+'"></i> '+esc(msg);document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
async function boot(){document.body.dataset.theme=theme();try{const m=await api('/api/auth/me');state.user=m.user;state.csrf=m.csrfToken;await load();render()}catch{login()}}
async function load(){const [a,u,g,s,e,d,f,ml,pp]=await Promise.all([api('/api/apartments'),api('/api/units'),api('/api/guests'),api('/api/stays'),api('/api/expenses'),api('/api/dashboard'),api('/api/property-financials'),api('/api/apartment-leases'),api('/api/property-partners')]);Object.assign(state,{apartments:a,units:u,guests:g,stays:s,expenses:e,dashboard:d,financials:f,masterLeases:ml,partners:pp});if(admin())state.users=await api('/api/users')}
function login(){app.innerHTML=`<div class="login"><section class="login-left"><div class="login-brand"><div class="brand-icon"><i class="fas fa-building"></i></div><strong>ZNA PROPERTY</strong></div><h1>Run your rental<br><em>like a business.</em></h1><p>Workspace untuk property yang Anda sewa bulanan lalu operasikan kembali sebagai sewa harian. Kelola unit, booking, biaya sewa induk, profit, dan pembagian hasil dalam satu sistem.</p><div class="login-points"><div><strong><i class="fas fa-calendar-check"></i> Daily Rental</strong><span>Booking sampai pembayaran</span></div><div><strong><i class="fas fa-file-contract"></i> Master Lease</strong><span>Biaya sewa property bulanan</span></div><div><strong><i class="fas fa-chart-pie"></i> Profit Split</strong><span>Porsi partner per property</span></div></div></section><section class="login-right"><div class="login-box"><div class="login-brand"><div class="brand-icon"><i class="fas fa-building"></i></div><div><strong>ZNA Property</strong><small style="display:block;color:var(--muted);font-size:10px">Rental Operations</small></div></div><h2>Sign in</h2><p>Masuk menggunakan akun admin atau viewer.</p><form id="loginForm"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:13px"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn gold" style="width:100%;justify-content:center;margin-top:18px"><i class="fas fa-right-to-bracket"></i> Masuk</button><div id="loginErr" class="alert error hidden" style="margin-top:12px"></div></form></div></section></div>`;$('loginForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),x=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});state.user=x.user;state.csrf=x.csrfToken;await load();render()}catch(err){$('loginErr').textContent=err.message;$('loginErr').classList.remove('hidden')}}}
function nav(key,icon,label){return `<button class="nav-btn ${state.page===key?'active':''}" onclick="go('${key}')"><i class="fas ${icon}"></i><span>${label}</span></button>`}

function openMasterLease(apartmentId,id){const a=state.masterLeases.find(x=>Number(x.id)===Number(id))||state.masterLeases.find(x=>Number(x.apartment_id)===Number(apartmentId)&&x.status==='active');const body=`<div class="notice" style="margin-bottom:13px"><i class="fas fa-circle-info"></i> Ini adalah <strong>biaya sewa induk</strong> yang Anda bayar ke pemilik property. Bukan pendapatan dari tamu.</div><div class="form-grid"><div class="field full"><label>Property</label><select id="mlp">${state.apartments.map(x=>`<option value="${x.id}" ${(Number(x.id)===Number(apartmentId||a?.apartment_id))?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Nama pemilik / landlord</label><input id="mll" value="${esc(a?.landlord_name||'')}"></div><div class="field"><label>Sewa bulanan</label><input id="mlr" type="number" min="0" value="${a?.monthly_rent||0}"></div><div class="field"><label>Mulai</label><input id="mls" type="date" value="${a?.start_date||dateNow()}"></div><div class="field"><label>Selesai</label><input id="mle" type="date" value="${a?.end_date||''}"></div><div class="field"><label>Jatuh tempo tanggal</label><input id="mld" type="number" min="1" max="28" value="${a?.payment_day||1}"></div><div class="field"><label>Deposit</label><input id="mldep" type="number" min="0" value="${a?.deposit||0}"></div><div class="field"><label>Status</label><select id="mls2"><option value="active" ${a?.status==='active'?'selected':''}>Active</option><option value="upcoming" ${a?.status==='upcoming'?'selected':''}>Upcoming</option><option value="ended" ${a?.status==='ended'?'selected':''}>Ended</option></select></div><div class="field full"><label>Catatan</label><textarea id="mln">${esc(a?.notes||'')}</textarea></div></div>`;modal('Sewa Induk Property',body,async()=>{const b={apartment_id:$('mlp').value,landlord_name:$('mll').value,start_date:$('mls').value,end_date:$('mle').value,monthly_rent:$('mlr').value,deposit:$('mldep').value,payment_day:$('mld').value,status:$('mls2').value,notes:$('mln').value};await api(a?`/api/apartment-leases/${a.id}`:'/api/apartment-leases',{method:a?'PUT':'POST',body:JSON.stringify(b)})})}
function openPartner(apartmentId,id){const p=id?state.partners.find(x=>Number(x.id)===Number(id)):null;const body=`<div class="notice" style="margin-bottom:13px"><i class="fas fa-percent"></i> Total porsi partner untuk satu property maksimal <strong>100%</strong>.</div><div class="form-grid"><div class="field full"><label>Property</label><select id="ppa">${state.apartments.map(x=>`<option value="${x.id}" ${(Number(x.id)===Number(apartmentId||p?.apartment_id))?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Nama partner</label><input id="ppn" value="${esc(p?.partner_name||'')}"></div><div class="field"><label>Porsi (%)</label><input id="pps" type="number" min=".01" max="100" step=".01" value="${p?.share_percent||''}"></div><div class="field full"><label>Akun user terkait (opsional)</label><select id="ppu"><option value="">Tidak dikaitkan</option>${state.users.map(u=>`<option value="${u.id}" ${Number(u.id)===Number(p?.user_id)?'selected':''}>${esc(u.name)} · ${esc(u.role)}</option>`).join('')}</select></div></div>`;modal('Partner & Profit Share',body,async()=>{const b={apartment_id:$('ppa').value,partner_name:$('ppn').value,share_percent:$('pps').value,user_id:$('ppu').value||null};await api(p?`/api/property-partners/${p.id}`:'/api/property-partners',{method:p?'PUT':'POST',body:JSON.stringify(b)})})}
function openUnit(id,apartmentId){const u=id?state.units.find(x=>Number(x.id)===Number(id)):null;modal(id?'Edit unit':'Tambah unit',`<div class="form-grid"><div class="field full"><label>Property</label><select id="ua">${state.apartments.map(a=>`<option value="${a.id}" ${(Number(a.id)===Number(apartmentId||u?.apartment_id))?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Kode unit</label><input id="uc" value="${esc(u?.unit_code||'')}" placeholder="A-1205"></div><div class="field"><label>Tipe</label><input id="ut" value="${esc(u?.type||'Studio')}"></div><div class="field"><label>Target bulanan</label><input id="um" type="number" min="0" value="${u?.monthly_target||0}"></div><div class="field"><label>Status</label><select id="us">${['available','occupied','maintenance','reserved'].map(x=>`<option value="${x}" ${u?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Catatan</label><textarea id="un">${esc(u?.notes||'')}</textarea></div></div>`,async()=>{const b={apartment_id:$('ua').value,unit_code:$('uc').value,type:$('ut').value,monthly_target:$('um').value,status:$('us').value,notes:$('un').value};if(!b.unit_code.trim())throw Error('Kode unit wajib');await api(id?`/api/units/${id}`:'/api/units',{method:id?'PUT':'POST',body:JSON.stringify(b)})})}
function openBooking(id){const s=id?state.stays.find(x=>Number(x.id)===Number(id)):null;modal(id?'Edit booking':'Booking baru',`<div class="form-grid"><div class="field full"><label>Unit</label><select id="bu">${state.units.map(u=>`<option value="${u.id}" ${Number(u.id)===Number(s?.unit_id)?'selected':''}>${esc(u.apartment_name)} · ${esc(u.unit_code)}</option>`).join('')}</select></div><div class="field full"><label>Guest</label><select id="bg">${state.guests.map(g=>`<option value="${g.id}" ${Number(g.id)===Number(s?.guest_id)?'selected':''}>${esc(g.name)} · ${esc(g.phone||'')}</option>`).join('')}</select></div><div class="field"><label>Check-in</label><input id="bi" type="date" value="${s?.check_in||dateNow()}"></div><div class="field"><label>Check-out</label><input id="bo" type="date" value="${s?.check_out||dateNow()}"></div><div class="field"><label>Tarif / malam</label><input id="br" type="number" min="0" value="${s?.nightly_rate||0}"></div><div class="field"><label>Cleaning fee</label><input id="bc" type="number" min="0" value="${s?.cleaning_fee||0}"></div><div class="field"><label>Deposit</label><input id="bd" type="number" min="0" value="${s?.deposit||0}"></div><div class="field"><label>Channel</label><select id="bch">${['direct','whatsapp','airbnb','booking.com','traveloka','tiket.com','agoda','other'].map(x=>`<option value="${x}" ${s?.channel===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="bs">${['reserved','checked_in','checked_out','cancelled'].map(x=>`<option value="${x}" ${s?.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Payment status</label><select id="bp">${['unpaid','partial','paid','refunded'].map(x=>`<option value="${x}" ${s?.payment_status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Catatan</label><textarea id="bn">${esc(s?.notes||'')}</textarea></div></div>`,async()=>{if(!$('bg').value)throw Error('Belum ada guest. Tambahkan guest melalui database/API terlebih dahulu.');const b={booking_code:s?.booking_code||'',unit_id:$('bu').value,guest_id:$('bg').value,check_in:$('bi').value,check_out:$('bo').value,nightly_rate:$('br').value,cleaning_fee:$('bc').value,deposit:$('bd').value,channel:$('bch').value,status:$('bs').value,payment_status:$('bp').value,notes:$('bn').value};await api(id?`/api/stays/${id}`:'/api/stays',{method:id?'PUT':'POST',body:JSON.stringify(b)})})}
function openStayPayment(id){const s=state.stays.find(x=>Number(x.id)===Number(id));if(!s)return;modal('Catat Pembayaran Booking',`<div class="notice" style="margin-bottom:12px">Booking <strong>${esc(s.booking_code)}</strong> · Total ${rupiah(s.total_amount)}</div><div class="form-grid"><div class="field"><label>Tanggal</label><input id="spdate" type="date" value="${dateNow()}"></div><div class="field"><label>Nominal</label><input id="spamt" type="number" min="0" value="${s.total_amount}"></div><div class="field"><label>Metode</label><select id="spm"><option value="bank_transfer">Bank transfer</option><option value="cash">Cash</option><option value="qris">QRIS</option><option value="card">Card</option></select></div><div class="field"><label>Reference</label><input id="spr"></div></div>`,async()=>{await api('/api/stay-payments',{method:'POST',body:JSON.stringify({stay_id:id,payment_date:$('spdate').value,amount:$('spamt').value,payment_method:$('spm').value,reference:$('spr').value})})})}
function openExpense(){modal('Tambah Pengeluaran',`<div class="form-grid"><div class="field"><label>Property</label><select id="ea">${state.apartments.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input id="ed" type="date" value="${dateNow()}"></div><div class="field"><label>Kategori</label><input id="ec" placeholder="Cleaning, listrik, maintenance"></div><div class="field"><label>Nominal</label><input id="em" type="number" min="0"></div><div class="field"><label>Vendor</label><input id="ev"></div><div class="field full"><label>Deskripsi</label><textarea id="ex"></textarea></div></div>`,async()=>{await api('/api/expenses',{method:'POST',body:JSON.stringify({apartment_id:$('ea').value,expense_date:$('ed').value,category:$('ec').value,amount:$('em').value,vendor:$('ev').value,description:$('ex').value})})})}
function openUser(id){const u=id?state.users.find(x=>Number(x.id)===Number(id)):null;modal(id?'Edit akun':'Tambah akun',`<div class="form-grid"><div class="field"><label>Nama</label><input id="unm" value="${esc(u?.name||'')}"></div><div class="field"><label>Email</label><input id="uem" type="email" value="${esc(u?.email||'')}" ${id?'disabled':''}></div><div class="field"><label>Role</label><select id="uro"><option value="viewer" ${u?.role!=='admin'?'selected':''}>Viewer — read only</option><option value="admin" ${u?.role==='admin'?'selected':''}>Admin — input & edit</option></select></div><div class="field"><label>Password ${id?'(kosong = tetap)':''}</label><input id="ups" type="password" minlength="8"></div></div>`,async()=>{const b={name:$('unm').value,role:$('uro').value};if(!id){b.email=$('uem').value;b.password=$('ups').value;if(b.password.length<8)throw Error('Password minimal 8 karakter')}else if($('ups').value)b.password=$('ups').value;await api(id?`/api/users/${id}`:'/api/users',{method:id?'PUT':'POST',body:JSON.stringify(b)})})}
boot();
</script>
</body>
