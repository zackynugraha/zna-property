<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RentBook Apartemen</title>
<style>
:root{--bg:#07090d;--panel:#0e1219;--panel2:#121822;--line:#202837;--text:#f5f7fb;--muted:#8c98aa;--accent:#8b5cf6;--accent2:#6d28d9;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07090d,#0b0f15 55%,#11091b);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-box{width:min(440px,100%);background:rgba(14,18,25,.92);border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 24px 80px #0008}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:22px}.brand-badge{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#6d28d9);display:grid;place-items:center}.login h1{font-size:30px;margin:28px 0 8px}.login p{color:var(--muted);margin:0 0 24px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:12px;color:#aab4c4;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#0a0e14;color:var(--text);border-radius:12px;padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7c3aed;box-shadow:0 0 0 3px #7c3aed22}.btn{border:1px solid var(--line);background:#121823;color:var(--text);border-radius:11px;padding:10px 14px;font-weight:700}.btn:hover{border-color:#39465b}.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);border:none}.btn.danger{color:#fecaca;border-color:#4b1f26;background:#190c10}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:12px}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);background:#090c12cc;backdrop-filter:blur(18px);padding:18px;position:sticky;top:0;height:100vh}.nav{margin-top:26px;display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#a9b2c1;text-align:left;padding:12px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:#171d28;color:#fff}.side-bottom{position:absolute;left:18px;right:18px;bottom:18px}.main{padding:26px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}.title{font-size:28px;font-weight:850}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:linear-gradient(180deg,#10151e,#0d1118);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:25px;font-weight:850;margin-top:9px}.label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.trend{font-size:12px;margin-top:8px;color:#aab4c4}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.panel{background:#0e131b;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-title{font-weight:800}.panel-body{padding:16px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px;border-bottom:1px solid #1a212c;white-space:nowrap}th{font-size:11px;color:#8e9aab;text-transform:uppercase;letter-spacing:.06em}td{font-size:13px}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#0d2a18;color:#74e69c}.red{background:#2c1116;color:#ff9da7}.yellow{background:#2a210d;color:#ffd66b}.blue{background:#0d222d;color:#83dfff}.purple{background:#211533;color:#cbb4ff}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{min-width:220px}.empty{padding:34px;text-align:center;color:var(--muted)}.chart{display:flex;gap:8px;align-items:end;height:190px;padding-top:10px}.bar{flex:1;min-width:12px;background:linear-gradient(180deg,#a78bfa,#6d28d9);border-radius:7px 7px 2px 2px}.bar-label{font-size:10px;color:#768295;text-align:center;margin-top:4px}.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:end}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#0d1219;border:1px solid #2a3341;border-radius:18px;box-shadow:0 30px 90px #000a}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-title{font-size:17px;font-weight:850}.modal-body{padding:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:10px}.toast{position:fixed;right:18px;bottom:18px;background:#111721;border:1px solid #303a49;color:#fff;padding:12px 14px;border-radius:12px;z-index:50;box-shadow:0 12px 36px #0007}.mobile-menu{display:none}.muted{color:var(--muted)}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.section-grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-menu{display:block}.main{padding:18px}}
@media(max-width:650px){.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.search{min-width:100%}.main{padding:14px}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="login-box">
    <div class="brand"><div class="brand-badge">🏢</div> RentBook</div>
    <h1>Pembukuan Apartemen</h1><p>Kelola unit, penyewa, kontrak, pembayaran, pengeluaran, dan laporan dalam satu dashboard.</p>
    <form id="loginForm"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Masuk ke Dashboard</button></form>
    <div id="loginError" class="muted" style="margin-top:12px"></div>
  </div>
</div>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-badge">🏢</div> RentBook</div>
    <div class="muted" style="margin-top:5px;font-size:12px">Apartment bookkeeping</div>
    <nav class="nav" id="nav">
      <button data-page="dashboard" class="active">📊 Dashboard</button>
      <button data-page="apartments">🏙️ Apartemen</button>
      <button data-page="units">🚪 Unit</button>
      <button data-page="tenants">👤 Penyewa</button>
      <button data-page="leases">📄 Kontrak Sewa</button>
      <button data-page="payments">💳 Pembayaran</button>
      <button data-page="expenses">🧾 Pengeluaran</button>
      <button data-page="reports">📈 Laporan</button>
      <button data-page="audit">🔐 Audit Log</button>
      <button data-page="settings">⚙️ Pengaturan</button>
    </nav>
    <div class="side-bottom"><div class="muted" style="font-size:12px;margin-bottom:8px" id="userLabel"></div><button class="btn ghost" id="logoutBtn" style="width:100%">Keluar</button></div>
  </aside>
  <main class="main">
    <div id="content"></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const state={user:null,csrf:null,page:'dashboard',data:{apartments:[],units:[],tenants:[],leases:[],payments:[],expenses:[]}};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const rup=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));
const fmtDate=v=>v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){$('#toast').textContent=m;$('#toast').classList.remove('hidden');clearTimeout(window.toastT);window.toastT=setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
async function api(url,opt={}){const o={...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}; if(state.csrf)o.headers['x-csrf-token']=state.csrf; const r=await fetch(url,o); if(!r.ok){let e={};try{e=await r.json()}catch{};throw new Error(e.error||'Terjadi kesalahan');} if(r.status===204)return null; return r.json();}
async function loadAll(){const [apartments,units,tenants,leases,payments,expenses]=await Promise.all([api('/api/apartments'),api('/api/units'),api('/api/tenants'),api('/api/leases'),api('/api/payments'),api('/api/expenses')]);state.data={apartments,units,tenants,leases,payments,expenses};}
function pageHead(title,sub,actions=''){return `<div class="topbar"><div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}
function btnAdd(label,action){return `<button class="btn primary" onclick="${action}">+ ${label}</button>`}
function empty(msg='Belum ada data'){return `<div class="empty">${msg}</div>`}
function badge(s){let c=s==='active'||s==='occupied'||s==='available'?'green':s==='maintenance'||s==='ended'?'red':s==='reserved'||s==='upcoming'?'yellow':'blue';return `<span class="badge ${c}">${esc(s)}</span>`}
function render(){const c=$('#content'); ({dashboard:renderDashboard,apartments:renderApartments,units:renderUnits,tenants:renderTenants,leases:renderLeases,payments:renderPayments,expenses:renderExpenses,reports:renderReports,audit:renderAudit,settings:renderSettings}[state.page])(c)}
async function renderDashboard(c){try{const d=await api('/api/dashboard'); const bars=[...d.monthly].reverse(); c.innerHTML=pageHead('Dashboard','Ringkasan operasional dan keuangan sewa apartemen',`<button class="btn" onclick="loadAll().then(render)">↻ Refresh</button>`)+`<div class="cards"><div class="card"><div class="label">Pendapatan</div><div class="metric">${rup(d.income)}</div><div class="trend">Total pembayaran pada filter aktif</div></div><div class="card"><div class="label">Pengeluaran</div><div class="metric">${rup(d.expense)}</div><div class="trend">Biaya operasional tercatat</div></div><div class="card"><div class="label">Laba Bersih</div><div class="metric">${rup(d.profit)}</div><div class="trend">Pendapatan − pengeluaran</div></div><div class="card"><div class="label">Okupansi</div><div class="metric">${d.occupancy.toFixed(1)}%</div><div class="trend">${d.occupied} dari ${d.units} unit terisi</div></div></div><div class="grid2"><div class="panel"><div class="panel-head"><div class="panel-title">Pendapatan 12 Bulan</div></div><div class="panel-body"><div class="chart">${bars.map(x=>{const max=Math.max(...bars.map(y=>Number(y.value)||0),1);let h=Math.max(8,Number(x.value)/max*145);return `<div class="bar-wrap"><div class="bar" style="height:${h}px" title="${rup(x.value)}"></div><div class="bar-label">${x.month.slice(5)}</div></div>`}).join('')}</div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Performa Apartemen</div></div><div class="table-wrap"><table><thead><tr><th>Apartemen</th><th>Unit</th><th>Terisi</th><th>Target</th></tr></thead><tbody>${d.byApartment.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.units}</td><td>${x.occupied}</td><td>${rup(x.target)}</td></tr>`).join('')||`<tr><td colspan="4">${empty()}</td></tr>`}</tbody></table></div></div></div>`}catch(e){c.innerHTML=empty(e.message)}}
function renderApartments(c){const a=state.data.apartments;c.innerHTML=pageHead('Apartemen','Kelola properti dan alamat',btnAdd('Apartemen','openApartment()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Kota</th><th>Unit</th><th>Target Sewa</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b><div class="muted">${esc(x.address||'')}</div></td><td>${esc(x.city||'-')}</td><td>${x.unit_count}</td><td>${rup(x.target_rent)}</td><td><button class="btn small" onclick='openApartment(${JSON.stringify(x)})'>Edit</button> <button class="btn small danger" onclick="del('apartments',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="5">${empty()}</td></tr>`}</tbody></table></div></div>`}
function renderUnits(c){const a=state.data.units;c.innerHTML=pageHead('Unit','Status, target sewa, dan unit yang sedang ditempati',btnAdd('Unit','openUnit()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Apartemen</th><th>Unit</th><th>Tipe</th><th>Status</th><th>Penyewa</th><th>Sewa</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.apartment_name)}</td><td><b>${esc(x.unit_code)}</b><div class="muted">Lantai ${esc(x.floor||'-')}</div></td><td>${esc(x.type||'-')}</td><td>${badge(x.status)}</td><td>${esc(x.tenant_name||'-')}</td><td>${rup(x.active_rent||x.monthly_target)}</td><td><button class="btn small" onclick='openUnit(${JSON.stringify(x)})'>Edit</button> <button class="btn small danger" onclick="del('units',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="7">${empty()}</td></tr>`}</tbody></table></div></div>`}
function renderTenants(c){const a=state.data.tenants;c.innerHTML=pageHead('Penyewa','Database penghuni dan kontak',btnAdd('Penyewa','openTenant()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Telepon</th><th>Email</th><th>No. Identitas</th><th>Kontrak</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.phone||'-')}</td><td>${esc(x.email||'-')}</td><td>${esc(x.id_number||'-')}</td><td>${x.lease_count}</td><td><button class="btn small" onclick='openTenant(${JSON.stringify(x)})'>Edit</button> <button class="btn small danger" onclick="del('tenants',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="6">${empty()}</td></tr>`}</tbody></table></div></div>`}
function renderLeases(c){const a=state.data.leases;c.innerHTML=pageHead('Kontrak Sewa','Lease aktif, berakhir, dan jadwal pembayaran',btnAdd('Kontrak','openLease()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Unit</th><th>Penyewa</th><th>Periode</th><th>Sewa Bulanan</th><th>Deposit</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.apartment_name)} · <b>${esc(x.unit_code)}</b></td><td>${esc(x.tenant_name)}<div class="muted">${esc(x.tenant_phone||'')}</div></td><td>${fmtDate(x.start_date)} — ${fmtDate(x.end_date)}</td><td>${rup(x.monthly_rent)}</td><td>${rup(x.deposit)}</td><td>${badge(x.status)}</td><td><button class="btn small" onclick='openLease(${JSON.stringify(x)})'>Edit</button> <button class="btn small danger" onclick="del('leases',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="7">${empty()}</td></tr>`}</tbody></table></div></div>`}
function renderPayments(c){const a=state.data.payments;c.innerHTML=pageHead('Pembayaran','Pemasukan sewa dan pembayaran lainnya',`<a class="btn" href="/api/export/payments" download>↓ CSV</a>`+btnAdd('Pembayaran','openPayment()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Periode</th><th>Unit</th><th>Penyewa</th><th>Jumlah</th><th>Metode</th><th>Referensi</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td>${fmtDate(x.payment_date)}</td><td>${x.period_month?String(x.period_month).slice(0,7):'-'}</td><td>${esc(x.apartment_name)} · ${esc(x.unit_code)}</td><td>${esc(x.tenant_name||'-')}</td><td><b>${rup(x.amount)}</b></td><td>${esc(x.payment_method)}</td><td>${esc(x.reference||'-')}</td><td><button class="btn small danger" onclick="del('payments',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="8">${empty()}</td></tr>`}</tbody></table></div></div>`}
function renderExpenses(c){const a=state.data.expenses;c.innerHTML=pageHead('Pengeluaran','Biaya operasional dan perawatan',`<a class="btn" href="/api/export/expenses" download>↓ CSV</a>`+btnAdd('Pengeluaran','openExpense()'))+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kategori</th><th>Properti</th><th>Unit</th><th>Vendor</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${a.map(x=>`<tr><td>${fmtDate(x.expense_date)}</td><td>${esc(x.category)}</td><td>${esc(x.apartment_name||'-')}</td><td>${esc(x.unit_code||'Semua')}</td><td>${esc(x.vendor||'-')}</td><td><b>${rup(x.amount)}</b></td><td><button class="btn small danger" onclick="del('expenses',${x.id})">Hapus</button></td></tr>`).join('')||`<tr><td colspan="7">${empty()}</td></tr>`}</tbody></table></div></div>`}
async function renderReports(c){const rows=await api('/api/reports/monthly');c.innerHTML=pageHead('Laporan','Ringkasan pendapatan dan pengeluaran per bulan',`<a class="btn" href="/api/export/leases" download>Kontrak CSV</a><a class="btn" href="/api/export/payments" download>Pembayaran CSV</a><a class="btn" href="/api/export/expenses" download>Pengeluaran CSV</a>`)+`<div class="cards"><div class="card"><div class="label">Total 12 Bulan</div><div class="metric">${rup(rows.reduce((s,x)=>s+Number(x.income),0))}</div></div><div class="card"><div class="label">Biaya 12 Bulan</div><div class="metric">${rup(rows.reduce((s,x)=>s+Number(x.expense),0))}</div></div><div class="card"><div class="label">Laba 12 Bulan</div><div class="metric">${rup(rows.reduce((s,x)=>s+Number(x.income)-Number(x.expense),0))}</div></div><div class="card"><div class="label">Bulan Berjalan</div><div class="metric">${rup(rows[0]?.income)}</div></div></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Bulan</th><th>Pendapatan</th><th>Pengeluaran</th><th>Laba</th><th>Margin</th></tr></thead><tbody>${rows.map(x=>{let p=Number(x.income),e=Number(x.expense),l=p-e,m=p?l/p*100:0;return `<tr><td>${esc(x.month)}</td><td>${rup(p)}</td><td>${rup(e)}</td><td><b>${rup(l)}</b></td><td>${m.toFixed(1)}%</td></tr>`}).join('')}</tbody></table></div></div>`}
async function renderSettings(c){c.innerHTML=pageHead('Pengaturan','Akun administrator dan keamanan')+`<div class="section-grid"><div class="panel"><div class="panel-head"><div class="panel-title">Akun aktif</div></div><div class="panel-body"><div style="font-size:22px;font-weight:850">${esc(state.user.name)}</div><div class="muted" style="margin-top:6px">${esc(state.user.email)} · ${esc(state.user.role)}</div></div></div><div class="panel"><div class="panel-head"><div class="panel-title">Ganti Password</div></div><div class="panel-body"><form onsubmit="changePassword(event)"><div class="field"><label>Password Saat Ini</label><input name="currentPassword" type="password" required></div><div class="field"><label>Password Baru</label><input name="newPassword" type="password" minlength="10" required></div><button class="btn primary">Simpan Password</button></form></div></div></div>`}
async function changePassword(e){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api('/api/auth/change-password',{method:'POST',body:JSON.stringify(b)});e.target.reset();toast('Password berhasil diubah')}catch(err){toast(err.message)}}
async function renderAudit(c){const a=await api('/api/audit');c.innerHTML=pageHead('Audit Log','Jejak aktivitas perubahan data')+`<div class="panel"><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Entity</th><th>ID</th><th>Detail</th></tr></thead><tbody>${a.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('id-ID')}</td><td>${esc(x.email||'-')}</td><td>${badge(x.action)}</td><td>${esc(x.entity)}</td><td>${x.entity_id||'-'}</td><td class="muted">${esc(JSON.stringify(x.details||{})).slice(0,160)}</td></tr>`).join('')||`<tr><td colspan="6">${empty()}</td></tr>`}</tbody></table></div></div>`}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div class="modal-title">${title}</div><button class="btn small" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div></div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function formFooter(){return `<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div>`}
function openApartment(x={}){modal(x.id?'Edit Apartemen':'Tambah Apartemen',`<form onsubmit="saveApartment(event,${x.id||0})"><div class="form-grid"><div class="field"><label>Nama</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>Kota</label><input name="city" value="${esc(x.city)}"></div><div class="field full"><label>Alamat</label><input name="address" value="${esc(x.address)}"></div><div class="field full"><label>Catatan</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>${formFooter()}</form>`)}
async function saveApartment(e,id){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api(id?`/api/apartments/${id}`:'/api/apartments',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Apartemen tersimpan')}catch(err){toast(err.message)}}
function openUnit(x={}){modal(x.id?'Edit Unit':'Tambah Unit',`<form onsubmit="saveUnit(event,${x.id||0})"><div class="form-grid"><div class="field"><label>Apartemen</label><select name="apartment_id" required>${state.data.apartments.map(a=>`<option value="${a.id}" ${String(a.id)===String(x.apartment_id)?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Kode Unit</label><input name="unit_code" required value="${esc(x.unit_code)}"></div><div class="field"><label>Lantai</label><input name="floor" value="${esc(x.floor)}"></div><div class="field"><label>Tipe</label><input name="type" placeholder="Studio / 1BR / 2BR" value="${esc(x.type)}"></div><div class="field"><label>Status</label><select name="status">${['available','occupied','maintenance','reserved'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Target Sewa / Bulan</label><input name="monthly_target" type="number" min="0" value="${x.monthly_target||0}"></div><div class="field full"><label>Catatan</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>${formFooter()}</form>`)}
async function saveUnit(e,id){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api(id?`/api/units/${id}`:'/api/units',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Unit tersimpan')}catch(err){toast(err.message)}}
function openTenant(x={}){modal(x.id?'Edit Penyewa':'Tambah Penyewa',`<form onsubmit="saveTenant(event,${x.id||0})"><div class="form-grid"><div class="field"><label>Nama Lengkap</label><input name="name" required value="${esc(x.name)}"></div><div class="field"><label>No. Telepon</label><input name="phone" value="${esc(x.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(x.email)}"></div><div class="field"><label>No. Identitas</label><input name="id_number" value="${esc(x.id_number)}"></div><div class="field full"><label>Alamat</label><textarea name="address">${esc(x.address)}</textarea></div><div class="field full"><label>Catatan</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>${formFooter()}</form>`)}
async function saveTenant(e,id){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api(id?`/api/tenants/${id}`:'/api/tenants',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Penyewa tersimpan')}catch(err){toast(err.message)}}
function openLease(x={}){modal(x.id?'Edit Kontrak':'Tambah Kontrak',`<form onsubmit="saveLease(event,${x.id||0})"><div class="form-grid"><div class="field"><label>Unit</label><select name="unit_id" required>${state.data.units.map(u=>`<option value="${u.id}" ${String(x.unit_id)===String(u.id)?'selected':''}>${esc(u.apartment_name)} · ${esc(u.unit_code)}</option>`).join('')}</select></div><div class="field"><label>Penyewa</label><select name="tenant_id" required>${state.data.tenants.map(t=>`<option value="${t.id}" ${String(x.tenant_id)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Mulai</label><input name="start_date" type="date" required value="${String(x.start_date||today()).slice(0,10)}"></div><div class="field"><label>Selesai</label><input name="end_date" type="date" value="${String(x.end_date||'').slice(0,10)}"></div><div class="field"><label>Sewa Bulanan</label><input name="monthly_rent" type="number" min="0" required value="${x.monthly_rent||0}"></div><div class="field"><label>Deposit</label><input name="deposit" type="number" min="0" value="${x.deposit||0}"></div><div class="field"><label>Tanggal Tagihan</label><input name="billing_day" type="number" min="1" max="28" value="${x.billing_day||1}"></div><div class="field"><label>Status</label><select name="status">${['active','upcoming','ended'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field full"><label>Catatan</label><textarea name="notes">${esc(x.notes)}</textarea></div></div>${formFooter()}</form>`)}
async function saveLease(e,id){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api(id?`/api/leases/${id}`:'/api/leases',{method:id?'PUT':'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Kontrak tersimpan')}catch(err){toast(err.message)}}
function openPayment(){modal('Tambah Pembayaran',`<form onsubmit="savePayment(event)"><div class="form-grid"><div class="field"><label>Unit</label><select id="payUnit" name="unit_id" required onchange="syncPayTenants()">${state.data.units.map(u=>`<option value="${u.id}">${esc(u.apartment_name)} · ${esc(u.unit_code)}</option>`).join('')}</select></div><div class="field"><label>Kontrak (opsional)</label><select id="payLease" name="lease_id"><option value="">Tanpa kontrak</option>${state.data.leases.map(l=>`<option value="${l.id}" data-unit="${l.unit_id}">${esc(l.unit_code)} · ${esc(l.tenant_name)} · ${rup(l.monthly_rent)}</option>`).join('')}</select></div><div class="field"><label>Penyewa (opsional)</label><select id="payTenant" name="tenant_id"><option value="">-</option>${state.data.tenants.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input name="payment_date" type="date" required value="${today()}"></div><div class="field"><label>Periode Bulan</label><input name="period_month" type="month" value="${today().slice(0,7)}"></div><div class="field"><label>Jumlah</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Metode</label><select name="payment_method"><option>bank_transfer</option><option>cash</option><option>ewallet</option><option>credit_card</option><option>other</option></select></div><div class="field"><label>Referensi</label><input name="reference"></div><div class="field full"><label>Keterangan</label><textarea name="description"></textarea></div></div>${formFooter()}</form>`)}
function syncPayTenants(){}
async function savePayment(e){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api('/api/payments',{method:'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Pembayaran tercatat')}catch(err){toast(err.message)}}
function openExpense(){modal('Tambah Pengeluaran',`<form onsubmit="saveExpense(event)"><div class="form-grid"><div class="field"><label>Properti</label><select name="apartment_id"><option value="">Semua / non-spesifik</option>${state.data.apartments.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div><div class="field"><label>Unit (opsional)</label><select name="unit_id"><option value="">Semua unit</option>${state.data.units.map(u=>`<option value="${u.id}">${esc(u.apartment_name)} · ${esc(u.unit_code)}</option>`).join('')}</select></div><div class="field"><label>Tanggal</label><input name="expense_date" type="date" required value="${today()}"></div><div class="field"><label>Kategori</label><input name="category" required placeholder="Listrik, air, service, cleaning..."></div><div class="field"><label>Jumlah</label><input name="amount" type="number" min="0" required></div><div class="field"><label>Vendor</label><input name="vendor"></div><div class="field full"><label>Keterangan</label><textarea name="description"></textarea></div></div>${formFooter()}</form>`)}
async function saveExpense(e){e.preventDefault();const b=Object.fromEntries(new FormData(e));try{await api('/api/expenses',{method:'POST',body:JSON.stringify(b)});closeModal();await loadAll();render();toast('Pengeluaran tercatat')}catch(err){toast(err.message)}}
async function del(resource,id){if(!confirm('Hapus data ini? Tindakan tidak dapat dibatalkan.'))return;try{await api(`/api/${resource}/${id}`,{method:'DELETE'});await loadAll();render();toast('Data dihapus')}catch(e){toast(e.message)}}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})});state.user=r.user;state.csrf=r.csrfToken;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userLabel').textContent=`${state.user.name} · ${state.user.email}`;await loadAll();render();}catch(err){$('#loginError').textContent=err.message}});
$('#logoutBtn').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST'});location.reload()}catch(e){toast(e.message)}});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;state.page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
(async()=>{try{const r=await api('/api/auth/me');state.user=r.user;state.csrf=r.csrfToken;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userLabel').textContent=`${state.user.name} · ${state.user.email}`;await loadAll();render()}catch{}})();
</script>
</body></html>
